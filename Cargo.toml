[package]
name = "screech"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Rusted-Metal — Twisted Metal 2 remake on Blade"
repository = "https://github.com/kvark/screech"
readme = "README.md"
default-run = "screech"

[[bin]]
name = "screech"
path = "src/main.rs"

[dependencies]
# Pin to blade main that exposes blade_render::shader_dir() (PR #391).
blade-engine = { git = "https://github.com/kvark/blade", rev = "33e2a5b003009acb1329a11207053f2f564db310" }
blade-render = { git = "https://github.com/kvark/blade", rev = "33e2a5b003009acb1329a11207053f2f564db310" }
egui = "0.34"
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
glam = { version = "0.32", features = ["mint"] }
log = "0.4"
mint = { version = "0.5", features = ["serde"] }
ron = "0.12"
serde = { version = "1", features = ["serde_derive"] }
winit = "0.30"

[build-dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
blade-graphics = { git = "https://github.com/kvark/blade", rev = "33e2a5b003009acb1329a11207053f2f564db310" }
console_error_panic_hook = "0.1"
console_log = "1"
include_dir = "0.7"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "Window"] }
web-time = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gles)'] }
