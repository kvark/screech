[package]
name = "screech"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Rusted-Metal — Twisted Metal 2 remake on Blade"
repository = "https://github.com/kvark/screech"
readme = "README.md"
default-run = "screech"

[[bin]]
name = "screech"
path = "src/main.rs"

[dependencies]
blade-engine = "0.2"
egui = "0.34"
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
env_logger = "0.11"
glam = { version = "0.32", features = ["mint"] }
log = "0.4"
mint = { version = "0.5", features = ["serde"] }
ron = "0.12"
serde = { version = "1", features = ["serde_derive"] }
winit = "0.30"
